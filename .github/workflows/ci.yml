name: GitHub Actions CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  NODE_ENV: production

jobs:
  build-and-test:
    name: Node.js v${{ matrix.node-version }} - Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Compile TypeScript Project
        run: npm run build

      - name: Execute Automated Test Suite
        run: npm test

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-app-${{ matrix.node-version }}
          path: dist/

  docker-build:
    name: Build & Push Container Image
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: compiled-app-20
          path: dist/

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: feezcodev
          password: ${{ secrets.FEEZCODEV }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: feezcodev/express-typescript-ci-cd:latest